{% extends "base.html" %}

{% block title %}Manual Processing - Receipt Automation{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <h1 class="mb-4">Manual PDF Processing</h1>

    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form action="{{ url_for('manual_process') }}" method="POST" id="manual-process-form">
                        <div class="mb-3">
                            <label for="week_select" class="form-label">Hafta Seçin</label>
                            <select class="form-select" id="week_select" name="selected_week" required>
                                <option value="">Hafta seçin...</option>
                                <!-- Options will be populated by JavaScript -->
                            </select>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label mb-0">İşlenecek PDF'ler</label>
                                <div id="pdf-count" class="badge bg-primary"></div>
                            </div>
                            <div class="list-group mb-3" id="pdf-list" style="max-height: 400px; overflow-y: auto;">
                                <template id="pdf-item-template">
                                    <div class="list-group-item">
                                        <h5 class="mb-1">${pdf.filename}</h5>
                                        <small class="text-muted">Dönem: ${pdf.period_start} - ${pdf.period_end}</small>
                                    </div>
                                </template>
                            </div>
                            <div id="no-pdfs-message" class="mt-3 py-2 px-3 rounded" style="display: none; background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba;">
                                <i class="bi bi-exclamation-triangle me-2"></i>
                                Seçilen hafta için PDF bulunamadı
                            </div>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-primary" id="process-button" disabled>
                                <span id="button-text">Seçilen Haftanın PDF'lerini İşle</span>
                                <span id="button-spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                                    <span class="visually-hidden">Yükleniyor...</span>
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">İşlem Durumu</h5>
                    <div id="processing-status">
                        <div class="py-2 px-3 rounded" style="background-color: #cff4fc; color: #055160; border: 1px solid #b6effb;">
                            <i class="bi bi-info-circle me-2"></i>
                            İşleme başlamak için bir hafta seçin
                        </div>
                    </div>
                    <div id="process-result" class="mt-3" style="max-height: 400px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('manual-process-form');
    const weekSelect = document.getElementById('week_select');
    const processButton = document.getElementById('process-button');
    const pdfList = document.getElementById('pdf-list');
    const noPdfsMessage = document.getElementById('no-pdfs-message');
    const processResult = document.getElementById('process-result');
    const pdfCount = document.getElementById('pdf-count');

    // Turkish month names
    const monthNames = [
        'Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran',
        'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'
    ];

    // Function to get Monday of a date
    function getMonday(d) {
        d = new Date(d);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    // Function to format date as YYYY-MM-DD
    function formatDate(date) {
        return date.toISOString().split('T')[0];
    }

    // Function to format date in Turkish
    function formatDateTurkish(date) {
        return `${date.getDate()} ${monthNames[date.getMonth()]} ${date.getFullYear()}`;
    }

    // Generate weeks (current week and previous 11 weeks)
    const today = new Date();
    const currentMonday = getMonday(today);
    
    for (let i = 0; i < 12; i++) {
        const monday = new Date(currentMonday);
        monday.setDate(monday.getDate() - (i * 7));
        const sunday = new Date(monday);
        sunday.setDate(sunday.getDate() + 6);

        const option = document.createElement('option');
        option.value = `${formatDate(monday)},${formatDate(sunday)}`;
        option.text = `${formatDateTurkish(monday)} - ${formatDateTurkish(sunday)}`;
        weekSelect.appendChild(option);
    }

    // Handle week selection change
    weekSelect.addEventListener('change', function() {
        if (!this.value) {
            processButton.disabled = true;
            pdfList.innerHTML = '';
            noPdfsMessage.style.display = 'none';
            return;
        }

        const [weekStart, weekEnd] = this.value.split(',');
        
        // Show loading state
        pdfList.innerHTML = '<div class="text-center"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">PDFler yükleniyor...</p></div>';
        processButton.disabled = true;
        noPdfsMessage.style.display = 'none';

        // Fetch PDFs for selected week
        fetch('/get-pdfs-for-week', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': '{{ csrf_token() }}'
            },
            body: JSON.stringify({
                week_start: weekStart,
                week_end: weekEnd
            })
        })
        .then(response => {
            // Check if the response is JSON before parsing
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                return response.json();
            } else {
                return response.text().then(text => {
                    throw new Error(`Server returned non-JSON response: ${text.substring(0, 100)}...`);
                });
            }
        })
        .then(data => {
            if (data.success) {
                if (data.pdfs.length > 0) {
                    // Update PDF count
                    pdfCount.textContent = `${data.pdfs.length} PDF Dosyası`;
                    pdfCount.style.display = 'block';
                    
                    const pdfsHtml = data.pdfs.map(pdf => `
                        <div class="list-group-item pdf-item">
                            <h5 class="mb-1">
                                ${pdf.company_name}
                            </h5>
                            <p class="mb-1"><small class="text-muted">Dosya: ${pdf.filename}</small></p>
                            <small class="text-muted">Dönem: ${pdf.period_start} - ${pdf.period_end}</small>
                        </div>
                    `).join('');
                    pdfList.innerHTML = pdfsHtml;
                    processButton.disabled = false;
                    noPdfsMessage.style.display = 'none';
                } else {
                    pdfCount.style.display = 'none';
                    pdfList.innerHTML = '';
                    noPdfsMessage.style.display = 'block';
                    processButton.disabled = true;
                }
            } else {
                pdfCount.style.display = 'none';
                pdfList.innerHTML = `<div class="alert alert-danger">Hata: ${data.error}</div>`;
                processButton.disabled = true;
            }
        })
        .catch(error => {
            pdfCount.style.display = 'none';
            pdfList.innerHTML = `<div class="alert alert-danger">PDF'ler yüklenirken hata oluştu: ${error}</div>`;
            processButton.disabled = true;
        });
    });

    // Handle form submission
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const selectedWeek = weekSelect.value;
        if (!selectedWeek) {
            alert('Lütfen bir hafta seçin');
            return;
        }

        // Disable the button immediately
        processButton.disabled = true;
        weekSelect.disabled = true;

        // Update button state
        processButton.innerHTML = `
            <span>İşleniyor...</span>
            <span class="spinner-border spinner-border-sm ms-2" role="status">
                <span class="visually-hidden">Yükleniyor...</span>
            </span>
        `;

        const processingStatus = document.getElementById('processing-status');
        processResult.innerHTML = '';
        
        // Update processing status
        processingStatus.innerHTML = `
            <div class="py-2 px-3 rounded" style="background-color: #cff4fc; color: #055160; border: 1px solid #b6effb;">
                <i class="bi bi-arrow-repeat me-2"></i>
                PDFler işleniyor, lütfen bekleyin...
            </div>
        `;

        // Create AbortController for timeout
        const controller = new AbortController();
        const timeout = setTimeout(() => {
            controller.abort();
        }, 300000); // 5 minute timeout

        fetch('/manual-process', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRF-Token': '{{ csrf_token() }}'
            },
            body: `selected_week=${selectedWeek}`,
            signal: controller.signal
        })
        .then(response => {
            clearTimeout(timeout);
            // Check if the response is JSON before parsing
            const contentType = response.headers.get('content-type');
            if (!response.ok) {
                return response.text().then(text => {
                    try {
                        // Only try to parse as JSON if it's actually JSON
                        if (contentType && contentType.includes('application/json')) {
                            const json = JSON.parse(text);
                            throw new Error(json.error || `Server error: ${response.status}`);
                        } else {
                            throw new Error(`Server error: ${text.substring(0, 100)}... (${response.status})`);
                        }
                    } catch (e) {
                        throw new Error(`Server error: ${e.message || response.status}`);
                    }
                });
            }
            
            if (contentType && contentType.includes('application/json')) {
                return response.json();
            } else {
                return response.text().then(text => {
                    throw new Error(`Server returned non-JSON response: ${text.substring(0, 100)}...`);
                });
            }
        })
        .then(data => {
            if (data.success) {
                let resultHtml = `<div class="alert alert-success">${data.message}</div>`;
                
                // Display processed files
                if (data.processed_files && data.processed_files.length > 0) {
                    resultHtml += '<h6 class="mt-3">İşlenen Dosyalar:</h6>';
                    resultHtml += data.processed_files.map(file => `
                        <div class="pdf-item small border rounded p-2 mb-2">
                            <div class="fw-bold">${file.company_name}</div>
                            <div class="text-muted">Dönem: ${file.period_start} - ${file.period_end}</div>
                        </div>
                    `).join('');
                }
                
                // Display automatically emailed files
                if (data.auto_emailed_files && data.auto_emailed_files.length > 0) {
                    resultHtml += '<h6 class="mt-3">Otomatik E-posta Gönderilen Dosyalar:</h6>';
                    resultHtml += data.auto_emailed_files.map(file => `
                        <div class="pdf-item small border rounded p-2 mb-2 bg-success bg-opacity-10">
                            <div class="fw-bold">${file.company_name}</div>
                            <div class="text-muted">Dönem: ${file.period_start} - ${file.period_end}</div>
                            <div class="small"><i class="bi bi-envelope-check me-1"></i>Gönderildi: ${file.email}</div>
                        </div>
                    `).join('');
                }
                
                // Display skipped files
                if (data.skipped_files && data.skipped_files.length > 0) {
                    resultHtml += '<h6 class="mt-3">Atlanan Dosyalar:</h6>';
                    resultHtml += data.skipped_files.map(file => `
                        <div class="pdf-item small border rounded p-2 mb-2 bg-light">
                            <div class="fw-bold">${file.filename}</div>
                            ${file.company_name ? `<div>Şirket: ${file.company_name}</div>` : ''}
                            ${file.invoice_number ? `<div>Fatura No: ${file.invoice_number}</div>` : ''}
                            <div class="text-danger">Neden: ${file.reason}</div>
                        </div>
                    `).join('');
                }
                
                processResult.innerHTML = resultHtml;
                
                processingStatus.innerHTML = `
                    <div class="py-2 px-3 rounded" style="background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc;">
                        <i class="bi bi-check-circle me-2"></i>
                        İşlem başarıyla tamamlandı
                    </div>
                `;

                setTimeout(() => {
                    weekSelect.dispatchEvent(new Event('change'));
                }, 1000);
            } else {
                throw new Error(data.error || 'İşlem sırasında bir hata oluştu');
            }
        })
        .catch(error => {
            clearTimeout(timeout);
            let errorMessage = error.message || error.toString();
            
            if (error.name === 'AbortError') {
                errorMessage = 'İşlem zaman aşımına uğradı. Lütfen daha sonra tekrar deneyin.';
            }
            
            processResult.innerHTML = `<div class="alert alert-danger">
                <strong>PDF'ler işlenirken hata oluştu:</strong><br>
                ${errorMessage}
            </div>`;
            
            processingStatus.innerHTML = `
                <div class="py-2 px-3 rounded" style="background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7;">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    İşlem sırasında hata oluştu
                </div>
            `;
        })
        .finally(() => {
            // Reset button state
            processButton.disabled = false;
            weekSelect.disabled = false;
            processButton.innerHTML = `
                <span>Seçilen Haftanın PDF'lerini İşle</span>
            `;
        });
    });
});
</script>
{% endblock %}
